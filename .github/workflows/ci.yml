name: Ludo Live CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      - name: Type-check frontend
        run: npm run typecheck
      - name: Validate Worker bundle without deploying
        run: npx wrangler deploy --dry-run
      - name: Package Cloudflare Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: ludo-live-pages
          path: dist/
          if-no-files-found: error
          retention-days: 14
