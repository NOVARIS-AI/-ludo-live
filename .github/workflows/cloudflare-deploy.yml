name: Deploy Ludo Live to Cloudflare

on:
  workflow_dispatch:
    inputs:
      deploy_worker:
        description: Deploy the Cloudflare Worker backend
        type: boolean
        required: true
        default: true
      deploy_pages:
        description: Deploy the Cloudflare Pages frontend
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: ludo-live-cloudflare-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check required deployment configuration
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_ORIGIN: ${{ secrets.LUDO_LIVE_PAGES_ORIGIN }}
          WORKER_API_URL: ${{ secrets.LUDO_LIVE_WORKER_API_URL }}
          REALTIME_URL: ${{ secrets.LUDO_LIVE_REALTIME_URL }}
        run: |
          test -n "$CF_API_TOKEN" || (echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1)
          test -n "$CF_ACCOUNT_ID" || (echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1)
          if [[ "${{ inputs.deploy_worker }}" == "true" || "${{ inputs.deploy_pages }}" == "true" ]]; then
            test -n "$PAGES_ORIGIN" || (echo "::error::Missing LUDO_LIVE_PAGES_ORIGIN"; exit 1)
          fi
          if [[ "${{ inputs.deploy_pages }}" == "true" ]]; then
            test -n "$WORKER_API_URL" || (echo "::error::Missing LUDO_LIVE_WORKER_API_URL"; exit 1)
            test -n "$REALTIME_URL" || (echo "::error::Missing LUDO_LIVE_REALTIME_URL"; exit 1)
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and type-check
        run: |
          npm run typecheck
          npm run build
      - name: Validate Worker deployment bundle
        run: npx wrangler deploy --dry-run

  deploy-worker:
    if: ${{ inputs.deploy_worker }}
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_ORIGIN: ${{ secrets.LUDO_LIVE_PAGES_ORIGIN }}
        run: npx wrangler deploy --var "ALLOWED_ORIGIN:$PAGES_ORIGIN"

  deploy-pages:
    if: ${{ inputs.deploy_pages }}
    needs: [validate, deploy-worker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build Pages site
        env:
          VITE_API_BASE_URL: ${{ secrets.LUDO_LIVE_WORKER_API_URL }}
          VITE_REALTIME_URL: ${{ secrets.LUDO_LIVE_REALTIME_URL }}
        run: npm run build
      - name: Deploy Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=ludo-live --branch=main
