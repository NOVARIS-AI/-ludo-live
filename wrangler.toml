name = "ludo-live-api"
main = "worker/index.ts"
compatibility_date = "2026-11-17"

[vars]
ALLOWED_ORIGIN = "http://localhost:5173"

[[durable_objects.bindings]]
name = "LUDO_ROOMS"
class_name = "LudoRoom"

[[durable_objects.bindings]]
name = "REALTIME_HUB"
class_name = "RealtimeHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LudoRoom", "RealtimeHub"]

[[durable_objects.bindings]]
name = "MATCHMAKING"
class_name = "MatchmakingLobby"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["MatchmakingLobby"]

[[durable_objects.bindings]]
name = "APP_DATA"
class_name = "AppData"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["AppData"]
